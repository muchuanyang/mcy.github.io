# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 木川羊的博客
subtitle: 记录思考成长
description: 木川羊的个人博客 —— 记录思考、沉淀成长。
keywords: 木川羊,博客,随笔,读书笔记,复盘
author: 木川羊
language: zh-cn
timezone: Asia/Shanghai

# URL
## 上线后你的博客地址就是 https://muchuanyang.github.io
url: https://muchuanyang.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
## 新建文章的默认文件名与布局
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
## 图片存放：统一放到 source/images/，文章里用 /images/xxx.jpg 引用
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Theme: https://hexo.io/themes/
theme: typography

# 归档页：一次显示全部文章（参考站就是这个效果）
archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false

# 分类页（暂时没用到分类，保留配置方便以后开启）
category_generator:
  per_page: 10
  enable_index_page: true

# 标签页：enable_index_page 会自动生成 /tags/ 页面，导航栏的「标签」就靠它
tag_generator:
  per_page: 10
  enable_index_page: true

# RSS 订阅文件 atom.xml
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '

# Deployment
## 一条命令 hexo deploy 会把生成好的网站推到仓库的 gh-pages 分支
deploy:
  type: git
  repo: https://github.com/muchuanyang/muchuanyang.github.io.git
  branch: gh-pages
